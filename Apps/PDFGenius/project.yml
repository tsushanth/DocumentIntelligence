name: PDFGenius
options:
  bundleIdPrefix: com.documentintelligence
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  defaultConfig: Release

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    INFOPLIST_KEY_CFBundleDevelopmentRegion: en
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"

packages:
  DocumentCore:
    path: ../../DocumentCore

targets:
  PDFGenius:
    type: application
    platform: iOS
    sources:
      - PDFGenius
    dependencies:
      - package: DocumentCore
        product: DocumentCore
    settings:
      base:
        INFOPLIST_FILE: PDFGenius/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.documentintelligence.pdfgenius
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: PDFGenius/Resources/Info.plist
      properties:
        CFBundleDisplayName: All-in-One PDF
        CFBundleName: PDFGenius
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - com.adobe.pdf
        UTImportedTypeDeclarations: []
