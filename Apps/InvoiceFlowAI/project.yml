name: InvoiceFlowAI
options:
  bundleIdPrefix: com.documentintelligence
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    DEVELOPMENT_TEAM: "7RS696YC75"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    FACEBOOK_APP_ID: ""
    FACEBOOK_CLIENT_TOKEN: ""

packages:
  DocumentCore:
    path: ../../DocumentCore
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "17.0.0"

targets:
  InvoiceFlowAI:
    type: application
    platform: iOS
    sources:
      - InvoiceFlowAI
    dependencies:
      - package: DocumentCore
        product: DocumentCore
      - package: FacebookSDK
        product: FacebookCore
      - package: FacebookSDK
        product: FacebookAEM
      - framework: AdServices.framework
        embed: false
      - framework: iAd.framework
        embed: false
    settings:
      base:
        INFOPLIST_FILE: InvoiceFlowAI/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: InvoiceFlowAI/Resources/InvoiceFlowAI.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.documentintelligence.invoiceflow
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: InvoiceFlowAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: InvoiceFlow Pro
        CFBundleName: InvoiceFlowAI
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "InvoiceFlow AI needs camera access to scan receipts"
        NSPhotoLibraryUsageDescription: "InvoiceFlow AI needs photo library access to import receipts"
        NSSpeechRecognitionUsageDescription: "InvoiceFlow AI uses speech recognition for voice-to-invoice feature"
        NSMicrophoneUsageDescription: "InvoiceFlow AI needs microphone access for voice-to-invoice feature"
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: "This identifier will be used to deliver personalized ads to you."
        FacebookAppID: "$(FACEBOOK_APP_ID)"
        FacebookClientToken: "$(FACEBOOK_CLIENT_TOKEN)"
        FacebookDisplayName: "InvoiceFlow Pro"
        FacebookAutoLogAppEventsEnabled: true
        FacebookAdvertiserIDCollectionEnabled: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "fb$(FACEBOOK_APP_ID)"
        LSApplicationQueriesSchemes:
          - fbapi
          - fb-messenger-share-api
          - fbauth2
          - fbshareextension
